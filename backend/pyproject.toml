[project]
name = "fitness-agent-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159.1",
    "langgraph==1.2.16",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
# Supply-chain safety (D-030): ignore package versions released less than ~2 weeks before
# this date. Move it forward deliberately when upgrading, never to "today".
exclude-newer = "2026-10-22T00:00:00Z"

[tool.pytest.ini_options]
# Lets tests do `from app.main import app` when run from backend/.
pythonpath = ["."]
testpaths = ["tests"]
# Database tests talk to Supabase, so they're opt-in: `uv run pytest -m db` (D-026).
addopts = "-m 'not db'"
markers = ["db: needs the Supabase database from backend/.env"]
